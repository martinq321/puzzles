fle:a=>a.slice().sort(()=>Math.random()-.5)};function download(name,text,type){const url=URL.createObjectURL(new Blob([text],{type})),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};function init(){
 app.innerHTML='<div class="toolbar"><button id="random">Random robot</button><button id="reset">Reset</button><button id="save">Download SVG</button></div><div class="split"><svg id="robot" viewBox="0 0 400 520" role="img" aria-label="Your robot"></svg><div id="parts"></div></div>';
 let state;const fields=[['head','Head',['Rounded square','Round','Angular','Armoured']],['body','Body',['Armoured','Oval','Shield','Big tummy','Box','Barrel','Triangle']],['hands','Hands',['Two fingers','Three fingers','Pincers','Closed grippers','Five fingers','Suction cups']],['feet','Feet',['Armoured boots','Round boots','Wide soles']],['eyes','Eyes',['Two circles','Visor','Three eyes','Happy eyes','Square eyes']],['mouth','Mouth',['Smile','Grille','Zigzag','Surprised','Straight']],['antenna','Antenna',['Single','Double','None']]];

 const sizes=[['headSize','Head size',80,130,115],['buildWidth','Body width',85,110,100],['legLength','Leg length',80,105,100],['handSize','Hand size',75,135,100],['shoulderSize','Shoulders',65,145,100],['footSize','Foot size',70,135,100]];
 let activeScheme='classic';
 const colours=[['metal','Head','#9564d4'],['bodyColour','Body','#9564d4'],['limbColour','Arms & legs','#b699e4'],['jointColour','Joints & hands','#74509f'],['accentColour','Lights & trim','#d8c5f2']];
 $('#parts').innerHTML='<details open><summary>Shape & face</summary>'+fields.map(([id,label,opts])=>`<p class="control">${options(id,label,opts.map((v,i)=>[i,v]))}</p>`).join('')+'</details><details open><summary>Proportions</summary>'+sizes.map(([id,label,min,max,val])=>`<p class="control"><label for="${id}">${label}</label><span class="range"><input type="range" id="${id}" min="${min}" max="${max}" value="${val}"><output for="${id}" id="${id}Value">${val}%</output></span></p>`).join('')+'</details><details open><summary>Colour scheme</summary><p class="scheme-note">Choose a matching outfit for your robot.</p><div hidden>'+colours.map(([id,label,val])=>`<input type="color" id="${id}" value="${val}" aria-label="${label}">`).join('')+'</div><div class="palettes">'+[['classic','Purple & white','#9564d4'],['blue','Blue & white','#458bd1'],['rose','Pink & white','#dc78a2'],['forest','Green & cream','#51a589'],['sunshine','Yellow & white','#efbf41'],['ice','Silver & white','#b1c3d5'],['rainbow','Rainbow','rainbow']].map(([id,label,c])=>`<button id="${id}" aria-pressed="${id==='classic'}"><span class="scheme-swatch" style="background:${c==='rainbow'?'linear-gradient(90deg,#eb7587,#f1ae61,#eed769,#72bf94,#6baadb,#aa87d0)': 'linear-gradient(90deg,'+c+' 0 50%,#f7f8fc 50% 100%)'}"></span>${label}</button>`).join('')+'</div></details>';

 function draw(){

 const metal=$('#metal').value, bodyColour=$('#bodyColour').value,h=+$('#head').value,e=+$('#eyes').value,m=+$('#mouth').value,ant=+$('#antenna').value,body=+$('#body').value;
 let svg=`<defs><linearGradient id="shell" x2=".8" y2="1"><stop stop-color="#ffffff"/><stop offset=".44" stop-color="${bodyColour}"/><stop offset="1" stop-color="#84929d"/></linearGradient><linearGradient id="helmet" x2=".9" y2="1"><stop stop-color="#ffffff"/><stop offset=".5" stop-color="${metal}"/><stop offset="1" stop-color="#8795a0"/></linearGradient><linearGradient id="limbs" x2=".8" y2="1"><stop stop-color="#ffffff"/><stop offset=".5" stop-color="${$('#limbColour').value}"/><stop offset="1" stop-color="#84929d"/></linearGradient><linearGradient id="dark" x2="0" y2="1"><stop stop-color="${$('#jointColour').value}"/><stop offset="1" stop-color="${$('#jointColour').value}"/></linearGradient></defs>
 <rect width="400" height="520" rx="20" fill="#f0f1ed"/><ellipse cx="200" cy="483" rx="151" ry="17" fill="#233746" opacity=".10"/>

${[148,252].map((x,i)=>`<g data-part="foot" transform="translate(${x} 438) scale(${(i?-1:1)*$('#footSize').value/100} ${$('#footSize').value/100}) translate(-148 -438)">${+$('#feet').value===0?'<path d="M125 438Q145 430 169 442L181 472Q180 487 160 488H92Q78 486 87 470Z" fill="url(#limbs)"/><path d="M92 477h76" stroke="#627785"/><path d="M116 461l-8 10m25-13-5 13" stroke="#95a8b2" stroke-width="2"/>':+$('#feet').value===1?'<rect x="112" y="436" width="68" height="52" rx="25" fill="url(#limbs)"/><path d="M119 478h54" stroke="#7c909c"/>':'<path d="M126 437H168L178 469H184V488H78V469H105Z" fill="url(#limbs)"/><path d="M85 478h92" stroke="#7c909c"/>'}</g>`).join('')}

 </g><g data-part="upper-body" transform="translate(200 0) scale(${bw} 1) translate(-200 0)"><path d="M123 195L83 247 70 295M277 195L317 247 330 295" fill="none" stroke="#1e2b38" stroke-width="35"/>

 const hand=+$('#hands').value;
 const handPaths=[
 '<path d="M-13 0L-23 17-20 40-10 40-10 22-3 16 7 24 7 43 18 38 21 17 12 0Z" fill="url(#dark)"/>',
 '<path d="M-13 0L-23 17-22 39-13 41-11 23-5 18-4 46 5 46 6 18 12 23 15 41 24 38 22 17 12 0Z" fill="url(#dark)"/>',
 '<path d="M-11 0L-23 17Q-29 34-10 43L-4 33Q-18 28-10 19L0 13 10 19Q18 28 4 33L10 43Q29 34 23 17L11 0Z" fill="url(#limbs)"/><circle cy="6" r="7" fill="url(#dark)"/>',
 '<rect x="-18" y="2" width="36" height="34" rx="11" fill="url(#limbs)"/><path d="M-8 13v15M0 12v17M8 13v15" stroke="#687e8b" stroke-width="2"/>',
 '<path d="M-16 5V-6Q-12-12-8-6V7-12Q-4-18 0-12V7-13Q4-19 8-13V9-5Q12-11 16-5V19L23 10Q30 9 28 17L17 37H-10L-21 24-26 12Q-25 5-19 10L-16 15Z" fill="url(#limbs)"/>',
 '<path d="M-7 0v22h14V0" fill="url(#dark)"/><ellipse cy="27" rx="24" ry="10" fill="url(#limbs)"/><path d="M-20 29q20 10 40 0" fill="none"/>'
 ];
 svg+='<g data-part="hand" transform="translate(70 330) rotate(8) scale('+handScale+')">'+handPaths[hand]+'</g><g data-part="hand" transform="translate(330 330) rotate(-8) scale('+(-handScale)+' '+handScale+')">'+handPaths[hand]+'</g>';
 const shapes=['M137 169Q200 155 263 169Q277 184 270 220L248 280Q200 309 152 280L130 220Q123 184 137 169Z','M200 160C296 160 282 257 244 286Q200 308 156 286C118 257 104 160 200 160Z','M136 168H264L276 205 251 281 200 307 149 281 124 205Z','M166 164Q200 156 234 164C246 197 296 208 290 265C286 317 241 332 200 332C159 332 114 317 110 265C104 208 154 197 166 164Z','M137 165H263Q275 165 275 179V288Q275 302 261 302H139Q125 302 125 288V179Q125 165 137 165Z','M145 169Q200 150 255 169Q285 235 255 300Q200 321 145 300Q115 235 145 169Z','M166 163H234L291 289Q293 307 275 307H125Q107 307 109 289Z'];
 svg+=`<path data-part="body" d="${shapes[body]}" fill="url(#shell)"/><path d="M148 189Q170 177 193 186L189 228 155 216ZM252 189Q230 177 207 186L211 228 245 216Z" fill="#ffffff" opacity=".45" stroke="none"/><path d="M145 230l36 12m74-12-36 12" fill="none" stroke="#7b8c97" stroke-width="2"/><path d="M176 251L200 241 224 251 216 274 184 274Z" fill="url(#dark)"/><circle cx="200" cy="259" r="9" fill="#6de3da" stroke="#377f86" stroke-width="2"/><circle cx="200" cy="259" r="3" fill="#e8ffff" stroke="none"/>`;

 const heads=['M158 62H242Q252 62 252 74V138Q252 150 240 150H160Q148 150 148 138V74Q148 62 158 62Z','M200 60C266 60 269 133 230 148Q200 160 170 148C131 133 134 60 200 60Z','M168 61H232L256 85 250 126 229 150H171L150 126 144 85Z','M158 66Q200 55 242 66Q255 78 252 111L241 142Q200 160 159 142L148 111Q145 78 158 66Z'];
 svg+=`<rect x="139" y="88" width="11" height="31" rx="4" fill="${$('#accentColour').value}"/><rect x="250" y="88" width="11" height="31" rx="4" fill="${$('#accentColour').value}"/><path d="${heads[h]}" fill="url(#helmet)"/>`;

 const mouths=['<path d="M176 125Q200 151 224 125" fill="none" stroke-width="3"/>','<rect x="176" y="123" width="48" height="17" rx="4" fill="white"/><path d="M185 124v15m10-15v15m10-15v15m10-15v15" stroke-width="2"/>','<path d="M176 132l8-6 8 12 8-12 8 12 8-12 8 6" fill="none" stroke-width="2"/>','<ellipse cx="200" cy="132" rx="9" ry="11" fill="url(#dark)"/>','<path d="M181 132h38" fill="none" stroke-width="3"/>'];
 svg+=mouths[m];
 svg+='</g></g>';
 if(activeScheme==='rainbow'){svg=svg.replace('</defs>','<linearGradient id="rainbowPaint" x1="0" y1="0" x2="0.6" y2="1"><stop stop-color="#eb7587"/><stop offset=".2" stop-color="#f1ae61"/><stop offset=".4" stop-color="#eed769"/><stop offset=".6" stop-color="#72bf94"/><stop offset=".8" stop-color="#6baadb"/><stop offset="1" stop-color="#aa87d0"/></linearGradient></defs>').replaceAll('url(#shell)','url(#rainbowPaint)').replaceAll('url(#helmet)','url(#rainbowPaint)').replaceAll('url(#limbs)','url(#rainbowPaint)').replaceAll('url(#dark)','url(#rainbowPaint)').replaceAll('stroke="#192530"','stroke="#aa87d0"').replaceAll('stroke="#1e2b38"','stroke="#6baadb"');}
 svg=svg.replaceAll('#6de3da',$('#accentColour').value);if(activeScheme!=='rainbow')svg=svg.replaceAll('stroke="#192530"','stroke="'+$('#jointColour').value+'"').replaceAll('stroke="#1e2b38"','stroke="'+$('#jointColour').value+'"');$('#robot').innerHTML=svg;say('What will your robot look like?');
 }

 fields.forEach(([id])=>$('#'+id).onchange=draw);
 [...sizes,...colours].forEach(([id])=>$('#'+id).oninput=draw);

 const palettes={classic:['#9564d4','#9564d4','#b699e4','#74509f','#d8c5f2'],blue:['#458bd1','#458bd1','#91bde8','#366a9f','#c4e2fa'],rose:['#dc78a2','#dc78a2','#ecacc9','#a7527d','#f9d0e3'],forest:['#51a589','#51a589','#94cdb2','#387e69','#dce9b9'],sunshine:['#efbf41','#efbf41','#f5d67e','#ac8532','#fff0b4'],ice:['#b1c3d5','#b1c3d5','#d2deea','#76899f','#e8f3fc'],rainbow:['#aa87d0','#aa87d0','#fffaf5','#3a4258','#f0bd62']};
 function palette(name){activeScheme=name;colours.forEach(([id],i)=>$('#'+id).value=palettes[name][i]);Object.keys(palettes).forEach(key=>$('#'+key).setAttribute('aria-pressed',String(name===key)));draw();}

 Object.keys(palettes).forEach(name=>$('#'+name).onclick=()=>palette(name));
 $('#random').onclick=()=>{fields.forEach(([id,,opts])=>$('#'+id).value=Math.floor(Math.random()*opts.length));sizes.forEach(([id,,min,max])=>$('#'+id).value=min+Math.floor(Math.random()*(max-min+1)));palette(Core.shuffle(Object.keys(palettes))[0]);};
 $('#reset').onclick=()=>{fields.forEach(([id])=>$('#'+id).value=0);sizes.forEach(([id,,,,val])=>$('#'+id).value=val);$('#body').value=3;palette('classic');};
 $('#save').onclick=()=>download('my-robot.svg','<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 520">'+$('#robot').innerHTML+'</svg>','image/svg+xml');$('#body').value=3;draw();
};
init();</script></body></html>
